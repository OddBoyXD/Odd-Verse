name: "✨ Feature Request"
description: "Suggest an idea or improvement for Odd Verse"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Odd Verse better? Let us know below!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of what feature or enhancement you would like to see.
      placeholder: "I would like to have..."
    validations:
      required: true
  - type: textarea
    id: problem-solved
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or specific use case?
      placeholder: "I'm always frustrated when..."
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Proposed Solution or Alternatives
      description: Describe any alternative solutions or features you have considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context & Mockups
      description: Add any other context, screenshots, or mockups about the feature request here.
