name: Build and Release Odd Verse

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Variant Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/master_release.keystore 2>/dev/null || true
          if [ ! -s android/app/master_release.keystore ]; then
            echo "" | base64 -d > android/app/master_release.keystore
          fi
          ls -la android/app/master_release.keystore

      - name: Build Split-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Prepare & Organize Release APKs
        run: |
          mkdir -p release_artifacts
          VERSION_TAG=${GITHUB_REF_NAME:-v1.0.0}
          
          # Copy Split APKs
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release_artifacts/OddVerse-${VERSION_TAG}-arm64-v8a.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release_artifacts/OddVerse-${VERSION_TAG}-armeabi-v7a.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release_artifacts/OddVerse-${VERSION_TAG}-x86_64.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-x86-release.apk "release_artifacts/OddVerse-${VERSION_TAG}-x86.apk"
          fi
          
          # Copy Universal APK
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "release_artifacts/OddVerse-${VERSION_TAG}-universal.apk"
          fi
          
          ls -lh release_artifacts/

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Odd Verse Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release_artifacts/*
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
