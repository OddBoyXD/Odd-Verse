name: Build and Release Odd Verse

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Variant Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: false

      - name: Verify Keystore
        run: |
          if [ ! -f "android/app/master_release.keystore" ] && [ -f "android/signing/master_release.keystore" ]; then
            cp android/signing/master_release.keystore android/app/master_release.keystore
          fi
          ls -la android/app/master_release.keystore

      - name: Build Universal APK (100% Fresh Clean Build)
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          mkdir -p release_artifacts
          VERSION_TAG=${GITHUB_REF_NAME:-v1.0.3}
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "release_artifacts/OddVerse-${VERSION_TAG}-universal.apk"
          fi

      - name: Build Split-ABI APKs (100% Fresh Clean Build)
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
          VERSION_TAG=${GITHUB_REF_NAME:-v1.0.3}
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release_artifacts/OddVerse-${VERSION_TAG}-arm64-v8a.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release_artifacts/OddVerse-${VERSION_TAG}-armeabi-v7a.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release_artifacts/OddVerse-${VERSION_TAG}-x86_64.apk"
          fi
          cd release_artifacts
          sha256sum *.apk > sha256_checksums.txt
          cd ..
          ls -lh release_artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oddverse-apk-builds
          path: release_artifacts/*
          retention-days: 14

      - name: Upload APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Odd Verse Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release_artifacts/*
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
