name: Build 64-bit Dev APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    name: Fast 64-bit (arm64-v8a) Dev Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Keystore
        run: |
          if [ ! -f "android/app/master_release.keystore" ] && [ -f "android/signing/master_release.keystore" ]; then
            cp android/signing/master_release.keystore android/app/master_release.keystore
          fi
          ls -la android/app/master_release.keystore

      - name: Build 64-bit arm64-v8a APK
        run: flutter build apk --release --target-platform=android-arm64 --split-per-abi

      - name: Prepare Artifact
        run: |
          mkdir -p dev_artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dev_artifacts/OddVerse-v1.0.3-arm64-v8a.apk

      - name: Upload 64-bit APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OddVerse-v1.0.3-arm64-v8a
          path: dev_artifacts/OddVerse-v1.0.3-arm64-v8a.apk
          retention-days: 7
